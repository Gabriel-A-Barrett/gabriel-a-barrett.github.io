<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>Portfolio</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/black.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">

		<style>
			section.vanta-slide {
			position: relative;
			width: 100vw;
			height: 100vh;
			padding: 0;
			margin: 0;
			overflow: hidden;
			}

			section.vanta-slide > * {
			position: relative;
			z-index: 1;
			}
		</style>


	</head>
	<body>
		<div class="reveal">
		<div class="slides">
			<section id="vanta-bg" class="vanta-slide" data-state="vanta-init">
			<h1>Welcome to My Portfolio</h1>
			</section>
			<section>Projects</section>
		</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script src="plugin/mermaid/mermaid.js"></script>
		<script src="plugin/math/math.js"></script>
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				view: 'scroll',
				scrollProgress: false,

				navigationMode: 'default',

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes, RevealMermaid, RevealMath.KaTeX ],
			});
		</script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
<script>
let vantaEffect = null;

Reveal.on('slidechanged', (event) => {
  const current = event.currentSlide;
  const isVanta = current.dataset.state === 'vanta-init';

  if (isVanta && !vantaEffect) {
    vantaEffect = VANTA.WAVES({
      el: current,
      mouseControls: true,
      touchControls: true,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.0,
      scaleMobile: 1.0,
      color: 0x111111,
      shininess: 50
    });
  } else if (!isVanta && vantaEffect) {
    vantaEffect.destroy();
    vantaEffect = null;
  }
});
</script>

	</body>
</html>
